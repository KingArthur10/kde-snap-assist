; qmllint configuration (run via tests/lint.sh).
; Disabled categories are noise for this codebase, not real problems:
;  - unqualified: the script deliberately uses the root Window's properties via
;    QML dynamic scope from views and the imported JS files.
;  - import / unresolved-type: org.kde.kwin registers its types at runtime and
;    ships no .qmltypes, so qmllint cannot resolve WindowThumbnail and friends.
[General]
DisableDefaultImports=false

[Warnings]
UnqualifiedAccess=disable
ImportFailure=disable
UnresolvedType=disable
UnusedImports=warning
